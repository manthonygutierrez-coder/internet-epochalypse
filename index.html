document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0.78);\n    --panel-border: 1px solid var(--accent);\n    --panel-radius: 0px;\n    --panel-shadow: 0 0 0 1px rgba(61,255,122,0.12), 0 24px 60px rgba(0,0,0,0.6);\n    --title-weight: 700;\n    --title-spacing: 2px;\n    --title-transform: uppercase;\n    --panel-blur: blur(6px);\n    --tilt: 0deg;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { height: 100%; }\n  body {\n    background: var(--bg);\n    color: var(--key);\n    font-family: var(--hud-font);\n    overflow: hidden;\n    -webkit-font-smoothing: antialiased;\n    transition: background 0.4s linear;\n  }\n  #scene { position: fixed; inset: 0; z-index: 1; }\n\n  .layer {\n    position: fixed; inset: 0; z-index: 10;\n    pointer-events: none;\n    display: grid;\n    grid-template-rows: auto 1fr auto;\n    padding: 28px;\n  }\n  .interactive { pointer-events: auto; }\n\n  /* ── header ── */\n  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }\n  .brand { max-width: 50%; }\n  .brand .kicker {\n    font: 600 0.7rem/1 'Space Grotesk', sans-serif;\n    letter-spacing: 0.32em; text-transform: uppercase;\n    color: var(--accent); opacity: 0.9;\n  }\n  .brand h1 {\n    font-family: var(--hud-font);\n    font-size: clamp(1.4rem, 3.2vw, 2.5rem);\n    font-weight: var(--title-weight);\n    letter-spacing: var(--title-spacing);\n    text-transform: var(--title-transform);\n    line-height: 0.98; margin-top: 8px;\n    color: var(--key);\n    text-shadow: 0 0 24px color-mix(in srgb, var(--accent) 45%, transparent);\n  }\n  .brand .sub {\n    font: 400 0.78rem/1.4 'Space Grotesk', sans-serif;\n    color: color-mix(in srgb, var(--key) 60%, transparent);\n    margin-top: 8px; max-width: 36ch;\n  }\n\n  /* ── era HUD card ── */\n  .hud {\n    width: min(380px, 40vw);\n    background: var(--panel-bg);\n    border: var(--panel-border);\n    border-radius: var(--panel-radius);\n    box-shadow: var(--panel-shadow);\n    backdrop-filter: var(--panel-blur);\n    -webkit-backdrop-filter: var(--panel-blur);\n    padding: 22px 24px;\n    transform: rotate(var(--tilt));\n    transition: background 0.45s, border-color 0.45s, border-radius 0.45s, box-shadow 0.45s, transform 0.45s;\n    position: relative; overflow: hidden;\n  }\n  .hud .tag {\n    display: inline-block;\n    font: 700 0.62rem/1 'Space Grotesk', sans-serif;\n    letter-spacing: 0.18em; text-transform: uppercase;\n    color: var(--bg); background: var(--accent);\n    padding: 5px 9px; border-radius: 3px; margin-bottom: 14px;\n  }\n  .hud h2 {\n    font-family: var(--hud-font);\n    font-size: clamp(1.5rem, 2.6vw, 2.1rem);\n    font-weight: var(--title-weight);\n    text-transform: var(--title-transform);\n    letter-spacing: var(--title-spacing);\n    line-height: 1; color: var(--key);\n  }\n  .hud .years {\n    font: 600 0.74rem/1 'Space Grotesk', sans-serif;\n    letter-spacing: 0.22em; color: var(--accent);\n    margin: 8px 0 14px;\n  }\n  .hud .desc {\n    font: 400 0.92rem/1.55 'Space Grotesk', sans-serif;\n    color: color-mix(in srgb, var(--key) 82%, transparent);\n    margin-bottom: 16px; text-wrap: pretty;\n  }\n  .hud ul { list-style: none; display: flex; flex-direction: column; gap: 7px; }\n  .hud li {\n    font: 500 0.8rem/1.2 'Space Grotesk', sans-serif;\n    color: color-mix(in srgb, var(--key) 66%, transparent);\n    display: flex; align-items: center; gap: 10px;\n  }\n  .hud li::before {\n    content: ''; width: 7px; height: 7px; flex: none;\n    background: var(--accent); border-radius: 1px;\n    box-shadow: 0 0 8px var(--accent);\n  }\n  .expand-cue { display: none; }\n\n  /* ── center hint ── */\n  .hint {\n    align-self: center; justify-self: center; grid-row: 2;\n    font: 500 0.72rem/1 'Space Grotesk', sans-serif;\n    letter-spacing: 0.28em; text-transform: uppercase;\n    color: color-mix(in srgb, var(--key) 55%, transparent);\n    border: 1px solid color-mix(in srgb, var(--key) 22%, transparent);\n    padding: 11px 20px; border-radius: 999px;\n    backdrop-filter: blur(4px);\n    animation: float 3s ease-in-out infinite;\n    transition: opacity 0.8s, transform 0.8s;\n  }\n  .hint.gone { opacity: 0; transform: translateY(14px); pointer-events: none; }\n  @keyframes float { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }\n\n  /* ── timeline ── */\n  .dock { grid-row: 3; display: flex; flex-direction: column; align-items: center; gap: 14px; }\n  .meta-row {\n    width: min(960px, 92vw); display: flex; justify-content: space-between; align-items: center;\n    font: 600 0.68rem/1 'Space Grotesk', sans-serif; letter-spacing: 0.18em;\n    color: color-mix(in srgb, var(--key) 60%, transparent); text-transform: uppercase;\n  }\n  .era-index { color: var(--accent); }\n  .orbit-toggle {\n    background: color-mix(in srgb, var(--bg) 60%, transparent);\n    border: 1px solid color-mix(in srgb, var(--key) 25%, transparent);\n    color: var(--key); cursor: pointer;\n    font: 600 0.64rem/1 'Space Grotesk', sans-serif; letter-spacing: 0.14em;\n    padding: 7px 12px; border-radius: 999px; display: flex; align-items: center; gap: 7px;\n    transition: border-color 0.3s, color 0.3s;\n  }\n  .orbit-toggle::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }\n  .orbit-toggle:not(.on)::before { background: color-mix(in srgb, var(--key) 40%, transparent); box-shadow: none; }\n\n  .meta-left { display: flex; align-items: baseline; gap: 14px; }\n  .cur-year {\n    font-family: var(--hud-font); font-weight: var(--title-weight);\n    font-size: 1.5rem; line-height: 0.8; letter-spacing: var(--title-spacing);\n    color: var(--accent); text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);\n  }\n  .ctrl-cluster { display: flex; align-items: center; gap: 8px; }\n  .pill-btn {\n    background: color-mix(in srgb, var(--bg) 60%, transparent);\n    border: 1px solid color-mix(in srgb, var(--key) 25%, transparent);\n    color: var(--key); cursor: pointer;\n    font: 600 0.64rem/1 'Space Grotesk', sans-serif; letter-spacing: 0.14em;\n    padding: 7px 12px; border-radius: 999px; display: flex; align-items: center; gap: 7px;\n    transition: border-color 0.3s, color 0.3s, background 0.3s; text-transform: uppercase;\n  }\n  .pill-btn:hover { border-color: var(--accent); color: var(--accent); }\n  .pill-btn.dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }\n  .pill-btn.dot.off::before { background: color-mix(in srgb, var(--key) 40%, transparent); box-shadow: none; }\n\n  /* ── map / era-select overlay ── */\n  #mapview {\n    position: fixed; inset: 0; z-index: 55; display: none; flex-direction: column; padding: 6vh 5vw;\n    background: color-mix(in srgb, var(--bg) 88%, transparent);\n    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);\n  }\n  #mapview.open { display: flex; }\n  #mapview .map-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }\n  #mapview .map-head h2 { font-family: var(--hud-font); font-size: clamp(1.6rem,4vw,2.8rem); color: var(--key); letter-spacing: var(--title-spacing); text-transform: var(--title-transform); }\n  #mapview .map-head p { font: 500 0.78rem/1 'Space Grotesk', sans-serif; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-top: 8px; }\n  #mapview .map-close { align-self: flex-start; }\n  #mapview .map-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 18px; min-height: 0; }\n  .map-card {\n    position: relative; cursor: pointer; border-radius: 14px; overflow: hidden; padding: 22px 24px;\n    display: flex; flex-direction: column; justify-content: space-between; min-height: 150px;\n    border: 1px solid color-mix(in srgb, var(--key) 18%, transparent);\n    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s; color: #fff;\n  }\n  .map-card:hover { transform: translateY(-4px); box-shadow: 0 18px 50px rgba(0,0,0,0.5); }\n  .map-card .mc-yr { font: 700 0.7rem/1 'Space Grotesk', sans-serif; letter-spacing: 0.2em; opacity: 0.85; }\n  .map-card .mc-name { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: clamp(1.1rem,1.8vw,1.6rem); line-height: 1.02; margin-top: 6px; text-shadow: 0 2px 14px rgba(0,0,0,0.5); }\n  .map-card .mc-n { position: absolute; top: 16px; right: 20px; font: 800 1.4rem/1 'Space Grotesk'; opacity: 0.4; }\n  .map-card .mc-apps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }\n  .map-card .mc-chip { font: 700 0.6rem/1 'Space Grotesk'; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.3); }\n\n  .console {\n    width: min(960px, 92vw);\n    background: color-mix(in srgb, var(--bg) 72%, transparent);\n    border: 1px solid color-mix(in srgb, var(--key) 14%, transparent);\n    border-radius: 14px; padding: 18px 22px 14px;\n    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);\n    box-shadow: 0 20px 60px rgba(0,0,0,0.45);\n  }\n  .progress-track { height: 3px; background: color-mix(in srgb, var(--key) 14%, transparent); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }\n  #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 2px; }\n\n  .scrub-wrap { position: relative; height: 22px; display: flex; align-items: center; }\n  #scrubber {\n    -webkit-appearance: none; appearance: none; width: 100%; height: 5px;\n    background: color-mix(in srgb, var(--key) 16%, transparent); border-radius: 3px; outline: none; cursor: pointer;\n  }\n  #scrubber::-webkit-slider-thumb {\n    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;\n    background: var(--accent); cursor: grab; border: 3px solid var(--bg);\n    box-shadow: 0 0 14px var(--accent); transition: transform 0.12s;\n  }\n  #scrubber::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.18); }\n  #scrubber::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); box-shadow: 0 0 14px var(--accent); cursor: grab; }\n\n  .markers { display: flex; justify-content: space-between; margin-top: 12px; gap: 4px; }\n  .marker {\n    flex: 1; text-align: center; cursor: pointer;\n    font: 600 0.6rem/1.3 'Space Grotesk', sans-serif; letter-spacing: 0.06em; text-transform: uppercase;\n    color: color-mix(in srgb, var(--key) 42%, transparent);\n    transition: color 0.25s, transform 0.25s; padding-top: 4px;\n    position: relative;\n  }\n  .marker::before {\n    content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);\n    width: 6px; height: 6px; border-radius: 50%;\n    background: color-mix(in srgb, var(--key) 30%, transparent); transition: all 0.25s;\n  }\n  .marker:hover { color: color-mix(in srgb, var(--key) 80%, transparent); }\n  .marker.active { color: var(--accent); transform: translateY(-1px); }\n  .marker.active::before { background: var(--accent); box-shadow: 0 0 10px var(--accent); width: 8px; height: 8px; top: -11px; }\n  .marker .yr { display: block; font-size: 0.54rem; opacity: 0.6; margin-top: 2px; letter-spacing: 0; }\n\n  /* ════════ PER-ERA CHROME RESKIN ════════ */\n  body.era-dialup {\n    --hud-font: 'VT323', monospace; --panel-bg: rgba(4,16,9,0.82);\n    --panel-border: 1px solid var(--accent); --panel-radius: 0px; --tilt: 0deg;\n    --title-spacing: 1px; --title-transform: uppercase;\n    --panel-shadow: 0 0 0 1px rgba(61,255,122,0.18), inset 0 0 40px rgba(61,255,122,0.05), 0 24px 60px rgba(0,0,0,0.6);\n  }\n  body.era-dialup .hud::after {\n    content: ''; position: absolute; inset: 0; pointer-events: none;\n    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 2px, transparent 2px 4px);\n  }\n  body.era-dialup .hud h2 { font-size: 2rem; }\n\n  body.era-wildweb {\n    --hud-font: 'Comic Sans MS', 'Comic Sans', cursive; --panel-bg: rgba(20,8,40,0.86);\n    --panel-border: 3px dashed var(--accent2); --panel-radius: 4px; --tilt: -1.4deg;\n    --title-spacing: 0px; --title-transform: none; --title-weight: 700;\n    --panel-shadow: 6px 6px 0 var(--accent), 0 20px 50px rgba(0,0,0,0.5);\n  }\n  body.era-wildweb .hud .tag { transform: rotate(2deg); }\n  body.era-wildweb .brand h1 { text-shadow: 3px 3px 0 var(--accent2), 6px 6px 0 var(--accent); }\n\n  body.era-web2 {\n    --hud-font: 'Lucida Grande', 'Helvetica Neue', Helvetica, sans-serif; --panel-radius: 18px;\n    --panel-bg: linear-gradient(180deg, rgba(20,46,80,0.92), rgba(8,20,38,0.94));\n    --panel-border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); --tilt: 0deg;\n    --title-spacing: 0px; --title-transform: none; --title-weight: 700;\n    --panel-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 24px 60px rgba(0,0,0,0.5);\n  }\n  body.era-web2 .hud::before {\n    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 42%;\n    background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent); pointer-events: none;\n    border-radius: 18px 18px 60% 60%/18px 18px 30% 30%;\n  }\n  body.era-web2 .hud .tag { box-shadow: inset 0 1px 0 rgba(255,255,255,0.5); }\n\n  body.era-feed {\n    --hud-font: system-ui, -apple-system, 'Segoe UI', sans-serif; --panel-radius: 10px;\n    --panel-bg: rgba(16,20,28,0.7); --panel-border: 1px solid color-mix(in srgb, var(--key) 12%, transparent);\n    --tilt: 0deg; --title-spacing: -0.5px; --title-transform: none; --title-weight: 600;\n    --panel-shadow: 0 18px 50px rgba(0,0,0,0.45);\n  }\n  body.era-feed .hud .tag { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 4px 8px; }\n\n  body.era-vertical {\n    --hud-font: 'Archivo', 'Arial Black', sans-serif; --panel-radius: 8px;\n    --panel-bg: rgba(24,8,42,0.72); --panel-border: 1px solid var(--accent); --tilt: 0deg;\n    --title-spacing: -0.5px; --title-transform: uppercase; --title-weight: 900;\n    --panel-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent), 0 0 50px color-mix(in srgb, var(--accent) 30%, transparent), 0 22px 60px rgba(0,0,0,0.55);\n  }\n  body.era-vertical .brand h1, body.era-vertical .hud h2 { text-shadow: 0 0 22px var(--accent), 2px 0 0 color-mix(in srgb, var(--accent2) 70%, transparent); }\n\n  body.era-synthetic {\n    --hud-font: 'Space Grotesk', sans-serif; --panel-radius: 20px;\n    --panel-bg: rgba(14,20,38,0.55); --panel-border: 1px solid transparent; --tilt: 0deg;\n    --title-spacing: 0px; --title-transform: none; --title-weight: 500;\n    --panel-blur: blur(20px);\n    --panel-shadow: 0 24px 70px rgba(0,0,0,0.5);\n  }\n  body.era-synthetic .hud {\n    background:\n      linear-gradient(rgba(14,20,38,0.6), rgba(14,20,38,0.6)) padding-box,\n      linear-gradient(135deg, var(--accent), var(--accent2)) border-box;\n    border: 1px solid transparent;\n  }\n\n  /* ── responsive ── */\n  @media (max-width: 760px) {\n    .layer { padding: 11px; gap: 8px; }\n    /* keep brand + era card side-by-side but compact, so the top stays slim */\n    header { flex-direction: row; align-items: flex-start; gap: 10px; }\n    .brand { max-width: 40%; }\n    .brand .kicker { font-size: 0.52rem; letter-spacing: 0.22em; }\n    .brand h1 { font-size: 1.12rem; line-height: 0.95; margin-top: 5px; letter-spacing: 1px; }\n    .brand .sub { display: none; }\n\n    /* compact, CONTENT-bearing era card (the blurb stays — clamped, expandable) */\n    .hud { width: 58%; max-width: 58%; padding: 12px 13px 11px; cursor: pointer; }\n    .hud .tag { font-size: 0.55rem; padding: 4px 7px; margin-bottom: 8px; }\n    .hud h2 { font-size: 1.2rem; }\n    .hud .years { font-size: 0.62rem; margin: 5px 0 8px; }\n    .hud .desc {\n      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;\n      overflow: hidden; font-size: 0.8rem; line-height: 1.42; margin-bottom: 0;\n    }\n    .hud ul { display: none; gap: 6px; margin-top: 10px; }\n    .hud li { font-size: 0.72rem; }\n    /* expanded state (toggled by the cue) reveals the full blurb + touchstones */\n    .hud.expanded .desc { -webkit-line-clamp: unset; overflow: visible; }\n    .hud.expanded ul { display: flex; }\n    .expand-cue {\n      display: inline-flex; align-items: center; gap: 5px; margin-top: 9px;\n      background: color-mix(in srgb, var(--accent) 14%, transparent);\n      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);\n      color: var(--accent); border-radius: 999px; padding: 5px 11px; cursor: pointer;\n      font: 700 0.56rem/1 'Space Grotesk', sans-serif; letter-spacing: 0.16em; text-transform: uppercase;\n    }\n    .expand-cue i { font-style: normal; transition: transform 0.25s; }\n    .hud.expanded .expand-cue i { transform: rotate(180deg); }\n\n    .hint { display: none; }\n    .marker .yr { display: none; }\n    .marker { font-size: 0.5rem; }\n\n    /* dock: let the control pills wrap instead of overflowing */\n    .meta-row { flex-wrap: wrap; gap: 8px; font-size: 0.6rem; }\n    .ctrl-cluster { flex-wrap: wrap; gap: 6px; }\n    .pill-btn, .orbit-toggle { font-size: 0.56rem; padding: 6px 9px; }\n    .cur-year { font-size: 1.25rem; }\n    .console { padding: 14px 16px 12px; }\n\n    /* map view: 2-up, scrollable */\n    #mapview { padding: 5vh 5vw; }\n    #mapview .map-head { margin-bottom: 18px; }\n    #mapview .map-head h2 { font-size: 1.5rem; }\n    #mapview .map-grid { grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(118px, auto); overflow-y: auto; gap: 12px; }\n    .map-card { min-height: 118px; padding: 16px 16px; }\n  }\n  /* very short viewports (landscape phones): drop the clamped blurb preview but\n     keep the card tappable to expand — no more empty headers */\n  @media (max-width: 760px) and (max-height: 480px) {\n    .hud:not(.expanded) .desc { display: none; }\n    .hud h2 { font-size: 1.05rem; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"era-dialup\">\n\n  \n\n  <div id=\"scene\"><\u002Fdiv>\n\n  <div class=\"layer\">\n    <header>\n      <div class=\"brand interactive\">\n        <div class=\"kicker\">A 3D Chronology of Net Culture<\u002Fdiv>\n        <h1>Internet<br>Epochalypse<\u002Fh1>\n        <p class=\"sub\">Drag to orbit · scroll or scrub to travel through time. The interface itself reskins to each era it carries you into.<\u002Fp>\n      <\u002Fdiv>\n\n      <aside class=\"hud interactive\">\n        <span class=\"tag\" id=\"hud-tag\">CONNECTING…<\u002Fspan>\n        <h2 id=\"hud-title\">Dial-Up Dawn<\u002Fh2>\n        <div class=\"years\" id=\"hud-years\">1991 — 1996<\u002Fdiv>\n        <p class=\"desc\" id=\"hud-desc\">…<\u002Fp>\n        <ul id=\"hud-list\"><\u002Ful>\n        <button class=\"expand-cue interactive\" id=\"hud-expand\" aria-label=\"Show more\"><span>MORE<\u002Fspan><i>▾<\u002Fi><\u002Fbutton>\n      <\u002Faside>\n    <\u002Fheader>\n\n    <div class=\"hint\" id=\"hint\">Drag to orbit · Scroll to travel<\u002Fdiv>\n\n    <div class=\"dock\">\n      <div class=\"meta-row interactive\">\n        <div class=\"meta-left\">\n          <span class=\"era-index\" id=\"era-index\">01 / 06<\u002Fspan>\n          <span class=\"cur-year\" id=\"cur-year\">1991<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ctrl-cluster\">\n          <button class=\"pill-btn dot off interactive\" id=\"sound-toggle\"><span>SOUND: OFF<\u002Fspan><\u002Fbutton>\n          <button class=\"pill-btn dot interactive\" id=\"orbit-toggle\"><span>ORBIT: AUTO<\u002Fspan><\u002Fbutton>\n          <button class=\"pill-btn interactive\" id=\"map-toggle\"><span>▦ MAP<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"console interactive\">\n        <div class=\"progress-track\"><div id=\"progress-fill\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"scrub-wrap\">\n          <input type
